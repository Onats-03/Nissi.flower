t<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Flower Bouquet</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(to top,#87ceeb,#fce4ec);
    overflow:hidden;
    font-family:Arial,sans-serif;
}

h1{
    color:#d81b60;
    text-align:center;
}

.garden{
    position:relative;
    width:400px;
    height:500px;
}

.flower{
    position:absolute;
    cursor:pointer;
    transition:transform .5s;
}

.flower:hover{
    transform:scale(1.1);
}

.stem{
    width:8px;
    height:120px;
    background:#2e7d32;
    margin:auto;
}

.center{
    width:35px;
    height:35px;
    background:#ffeb3b;
    border-radius:50%;
    position:absolute;
    top:30px;
    left:22px;
    z-index:2;
}

.petal{
    width:40px;
    height:40px;
    background:#ff4081;
    border-radius:50%;
    position:absolute;
    opacity:.8;
    transition:.6s;
}

.flower.bloom .petal{
    transform:scale(1.3);
}

.message{
    margin-top:20px;
    font-size:24px;
    color:#c2185b;
    opacity:0;
    transition:1s;
    text-align:center;
}

.message.show{
    opacity:1;
}

.p1{top:0;left:20px;}
.p2{top:30px;left:0;}
.p3{top:30px;left:45px;}
.p4{top:60px;left:20px;}
.p5{top:15px;left:20px;}

#f1{left:50px;top:100px;}
#f2{left:170px;top:60px;}
#f3{left:280px;top:120px;}
</style>
</head>
<body>

<h1>🌸 Click the Flowers 🌸</h1>

<div class="garden">

    <div class="flower" id="f1" onclick="bloom(this)">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="center"></div>
        <div class="stem"></div>
    </div>

    <div class="flower" id="f2" onclick="bloom(this)">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="center"></div>
        <div class="stem"></div>
    </div>

    <div class="flower" id="f3" onclick="bloom(this)">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="center"></div>
        <div class="stem"></div>
    </div>

</div>

<div class="message" id="message">
    ❤️ Happy 22nd Monthsary ❤️<br>
    Every flower blooms just like my love for you.
</div>

<script>
let bloomed = 0;

function bloom(flower){
    if(!flower.classList.contains("bloom")){
        flower.classList.add("bloom");
        bloomed++;

        if(bloomed === 3){
            document.getElementById("message").classList.add("show");
        }
    }
}
</script>

</body>
</html>
